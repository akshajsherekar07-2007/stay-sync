# alembic.ini — StaySync Alembic configuration
#
# DATABASE_URL is read from the environment variable at runtime.
# Do NOT hardcode connection strings here.
# The env.py script overrides sqlalchemy.url with the value from Settings.

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used to generate migration file names
# Format: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s

# sys.path modification — ensures `app` package is importable
prepend_sys_path = .

# Timezone to use for migration timestamps
timezone = UTC

# Max length for the slug portion of the filename
truncate_slug_length = 40

# Version table name
version_table = alembic_version

# Whether to compare server defaults in autogenerate
# (requires extra comparison logic — disabled here for simplicity)
compare_server_defaults = false

# Compare column types strictly (catches VARCHAR(255) vs TEXT mismatches)
compare_type = true

# ── Logging ──────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
